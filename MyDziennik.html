<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dziennik Elektroniczny</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --primary: #1a56db; --primary-dark: #1e429f; }
    body { background: #f3f4f6; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
    .navbar { background: linear-gradient(135deg, #1a56db, #1e3a8a) !important; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .card-header { background: transparent; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
    .btn-primary { background: var(--primary); border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
    .grade-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 36px; height: 36px; border-radius: 8px; font-weight: 700; font-size: 1rem;
      background: #dbeafe; color: #1e40af;
    }
    .grade-badge.high { background: #d1fae5; color: #065f46; }
    .grade-badge.mid { background: #fef3c7; color: #92400e; }
    .grade-badge.low { background: #fee2e2; color: #991b1b; }
    .stat-card { transition: transform .15s; }
    .stat-card:hover { transform: translateY(-2px); }
    .nav-pills .nav-link { border-radius: 8px; color: #4b5563; font-weight: 500; }
    .nav-pills .nav-link.active { background: var(--primary); }
    .table th { font-weight: 600; font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; color: #6b7280; }
    .login-box {
      max-width: 420px; margin: 3rem auto;
      background: white; border-radius: 16px; padding: 2.5rem;
      box-shadow: 0 10px 40px rgba(0,0,0,.08);
    }
    .logo { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
    .role-badge { font-size: .7rem; padding: .25rem .6rem; border-radius: 20px; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: #9ca3af; }
    .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: .5; }
    #app { display: none; }
    #auth { display: none; }
    .sidebar-nav .nav-link { padding: .65rem 1rem; margin-bottom: .25rem; }
    .badge-obecny { background: #d1fae5; color: #065f46; }
    .badge-nieobecny { background: #fee2e2; color: #991b1b; }
    .badge-spozniony { background: #fef3c7; color: #92400e; }
    .badge-usprawiedliwiony { background: #e0e7ff; color: #3730a3; }
    .toast-container { z-index: 9999; }
    .option-row { cursor: pointer; border: 2px solid #e5e7eb; border-radius: 10px; padding: .75rem 1rem; margin-bottom: .5rem; transition: .15s; }
    .option-row:hover { border-color: #93c5fd; background: #f0f9ff; }
    .option-row.selected { border-color: var(--primary); background: #dbeafe; }
    .option-row.correct-mark { border-color: #059669; background: #d1fae5; }
    .q-card { border-left: 4px solid var(--primary); }
    .test-status-active { background: #d1fae5; color: #065f46; }
    .test-status-draft { background: #f3f4f6; color: #6b7280; }
    .msg-unread { border-left: 4px solid var(--primary); background: #f0f7ff; }
    .msg-bubble { max-width: 80%; padding: .75rem 1rem; border-radius: 12px; margin-bottom: .5rem; }
    .msg-from-me { background: #dbeafe; margin-left: auto; }
    .msg-from-other { background: #f3f4f6; }
    .announcement-card { border-left: 4px solid #f59e0b; }
    .hw-overdue { border-left: 4px solid #ef4444; }
    .hw-active { border-left: 4px solid #10b981; }
  </style>
</head>
<body>
  <div id="auth">
    <div class="container">
      <div class="login-box">
        <div class="text-center mb-4">
          <div class="logo"><i class="bi bi-journal-bookmark-fill"></i> Dziennik</div>
          <p class="text-muted small mt-1">Elektroniczny dziennik szkolny</p>
        </div>
        <ul class="nav nav-pills nav-fill mb-4" id="authTabs">
          <li class="nav-item"><button class="nav-link active" data-tab="login">Logowanie</button></li>
          <li class="nav-item"><button class="nav-link" data-tab="register">Rejestracja ucznia</button></li>
        </ul>
        <div id="loginForm">
          <div class="mb-3">
            <label class="form-label">Login</label>
            <input type="text" class="form-control" id="loginUsername" placeholder="Twój login" autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label">Hasło</label>
            <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
          </div>
          <div class="alert alert-danger d-none" id="loginError"></div>
          <button class="btn btn-primary w-100 py-2" onclick="doLogin()">
            <i class="bi bi-box-arrow-in-right"></i> Zaloguj się
          </button>
        </div>
        <div id="registerForm" class="d-none">
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label">Imię</label>
              <input type="text" class="form-control" id="regFirstName">
            </div>
            <div class="col-6">
              <label class="form-label">Nazwisko</label>
              <input type="text" class="form-control" id="regLastName">
            </div>
          </div>
          <div class="mb-3 mt-2">
            <label class="form-label">Login</label>
            <input type="text" class="form-control" id="regUsername" placeholder="min. 3 znaki">
          </div>
          <div class="mb-3">
            <label class="form-label">Hasło</label>
            <input type="password" class="form-control" id="regPassword" placeholder="min. 4 znaki">
          </div>
          <div class="mb-3">
            <label class="form-label">Kod rejestracyjny</label>
            <input type="text" class="form-control" id="regCode" placeholder="Kod od nauczyciela" autocomplete="off">
          </div>
          <div class="alert alert-danger d-none" id="regError"></div>
          <div class="alert alert-success d-none" id="regSuccess"></div>
          <button class="btn btn-primary w-100 py-2" onclick="doRegister()">
            <i class="bi bi-person-plus"></i> Załóż konto ucznia
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="app">
    <nav class="navbar navbar-dark sticky-top">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-journal-bookmark-fill"></i> Dziennik Elektroniczny</span>
        <div class="d-flex align-items-center gap-3 text-white">
          <span id="userInfo" class="small"></span>
          <button class="btn btn-outline-light btn-sm" onclick="doLogout()"><i class="bi bi-box-arrow-right"></i> Wyloguj</button>
        </div>
      </div>
    </nav>
    <div class="container-fluid py-4">
      <div class="row">
        <div class="col-lg-2 col-md-3 mb-3">
          <div class="card">
            <div class="card-body p-2">
              <nav class="nav flex-column sidebar-nav" id="sideNav"></nav>
            </div>
          </div>
        </div>
        <div class="col-lg-10 col-md-9">
          <div id="content"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast align-items-center text-bg-dark border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastBody"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ===== STORAGE (bezpieczny – działa też w sandboxie) =====
    const STORAGE_KEY = 'dziennik_elektroniczny_v2';
    const SESSION_KEY = 'dziennik_user';
    let memoryStore = null;
    let storageAvailable = false;

    function canUseStorage(store) {
      try {
        const t = '__test__';
        store.setItem(t, t);
        store.removeItem(t);
        return true;
      } catch (e) { return false; }
    }

    try { storageAvailable = canUseStorage(window.localStorage); } catch (e) { storageAvailable = false; }

    function emptyDB() {
      return { users: [], classes: [], subjects: [], grades: [], attendance: [], remarks: [], tests: [], submissions: [], registrationCodes: [], messages: [], groups: [], announcements: [], homework: [] };
    }

    function loadDB() {
      if (storageAvailable) {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const d = JSON.parse(raw);
            if (!d.tests) d.tests = [];
            if (!d.submissions) d.submissions = [];
            if (!d.registrationCodes) d.registrationCodes = [];
            if (!d.messages) d.messages = [];
            if (!d.groups) d.groups = [];
            if (!d.announcements) d.announcements = [];
            if (!d.homework) d.homework = [];
            return d;
          }
        } catch (e) {}
      }
      if (memoryStore) return memoryStore;
      return emptyDB();
    }

    function saveDB(db) {
      memoryStore = db;
      if (storageAvailable) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
        catch (e) { storageAvailable = false; }
      }
    }

    let db = loadDB();
    memoryStore = db;

    // Ukryte konto nauczyciela – tworzone automatycznie, hasło nie jest pokazywane na stronie
    if (!db.users.find(u => u.role === 'teacher')) {
      db.users.push({
        id: 'teacher-1',
        username: 'nauczyciel',
        password: 'domotokoks',
        role: 'teacher',
        firstName: 'Jan',
        lastName: 'Kowalski',
        createdAt: new Date().toISOString()
      });
      saveDB(db);
    }

    function saveSession(user) {
      try {
        if (canUseStorage(window.sessionStorage)) {
          sessionStorage.setItem(SESSION_KEY, JSON.stringify(user));
          return;
        }
      } catch (e) {}
      window.__dziennikSession = user;
    }
    function loadSession() {
      try {
        if (canUseStorage(window.sessionStorage)) {
          const s = sessionStorage.getItem(SESSION_KEY);
          if (s) return JSON.parse(s);
        }
      } catch (e) {}
      return window.__dziennikSession || null;
    }
    function clearSession() {
      try {
        if (canUseStorage(window.sessionStorage)) sessionStorage.removeItem(SESSION_KEY);
      } catch (e) {}
      window.__dziennikSession = null;
    }

    let currentUser = null;
    let toastInstance = null;
    let editingTestId = null; // przy tworzeniu/edycji testu
    let testTimerInterval = null;

    function showToast(msg, isError = false) {
      const el = document.getElementById('toast');
      document.getElementById('toastBody').textContent = msg;
      el.className = `toast align-items-center border-0 ${isError ? 'text-bg-danger' : 'text-bg-dark'}`;
      if (!toastInstance) toastInstance = new bootstrap.Toast(el, { delay: 2800 });
      toastInstance.show();
    }

    function uid() {
      return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function gradeClass(val) {
      const n = parseFloat(String(val).replace(',', '.').replace('+', '.25').replace('-', '-.25'));
      if (isNaN(n)) return '';
      if (n >= 4.5) return 'high';
      if (n >= 3) return 'mid';
      return 'low';
    }

    function statusBadge(s) {
      const map = { obecny: 'badge-obecny', nieobecny: 'badge-nieobecny', 'spóźniony': 'badge-spozniony', usprawiedliwiony: 'badge-usprawiedliwiony' };
      return `<span class="badge ${map[s] || 'bg-secondary'}">${s}</span>`;
    }

    // ===== AUTH =====
    document.querySelectorAll('#authTabs .nav-link').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#authTabs .nav-link').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('loginForm').classList.toggle('d-none', tab !== 'login');
        document.getElementById('registerForm').classList.toggle('d-none', tab !== 'register');
      });
    });

    function doLogin() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const err = document.getElementById('loginError');
      err.classList.add('d-none');
      const user = db.users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.password === password);
      if (!user) {
        err.textContent = 'Nieprawidłowy login lub hasło';
        err.classList.remove('d-none');
        return;
      }
      currentUser = { id: user.id, username: user.username, firstName: user.firstName, lastName: user.lastName, role: user.role, classId: user.classId };
      saveSession(currentUser);
      showApp();
    }

    function doRegister() {
      const firstName = document.getElementById('regFirstName').value.trim();
      const lastName = document.getElementById('regLastName').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const code = document.getElementById('regCode').value.trim().toUpperCase();
      const err = document.getElementById('regError');
      const ok = document.getElementById('regSuccess');
      err.classList.add('d-none');
      ok.classList.add('d-none');
      if (!firstName || !lastName || !username || !password || !code) {
        err.textContent = 'Wszystkie pola są wymagane';
        err.classList.remove('d-none');
        return;
      }
      if (username.length < 3) { err.textContent = 'Login min. 3 znaki'; err.classList.remove('d-none'); return; }
      if (password.length < 4) { err.textContent = 'Hasło min. 4 znaki'; err.classList.remove('d-none'); return; }
      if (db.users.find(u => u.username.toLowerCase() === username.toLowerCase())) {
        err.textContent = 'Taki login już istnieje';
        err.classList.remove('d-none');
        return;
      }
      const codeEntry = (db.registrationCodes || []).find(c => c.code === code && !c.used);
      if (!codeEntry) {
        err.textContent = 'Nieprawidłowy lub już użyty kod rejestracyjny';
        err.classList.remove('d-none');
        return;
      }
      db.users.push({
        id: uid(), username, password, role: 'student',
        firstName, lastName, classId: null, createdAt: new Date().toISOString()
      });
      codeEntry.used = true;
      codeEntry.usedAt = new Date().toISOString();
      codeEntry.usedBy = username;
      saveDB(db);
      ok.textContent = 'Konto utworzone! Możesz się zalogować.';
      ok.classList.remove('d-none');
      document.getElementById('regFirstName').value = '';
      document.getElementById('regLastName').value = '';
      document.getElementById('regUsername').value = '';
      document.getElementById('regPassword').value = '';
      document.getElementById('regCode').value = '';
    }

    function doLogout() {
      currentUser = null;
      clearSession();
      if (testTimerInterval) { clearInterval(testTimerInterval); testTimerInterval = null; }
      document.getElementById('app').style.display = 'none';
      document.getElementById('auth').style.display = 'block';
    }

    function checkAuth() {
      try {
        const saved = loadSession();
        if (saved) {
          currentUser = saved;
          const u = db.users.find(x => x.id === currentUser.id);
          if (u) {
            currentUser.classId = u.classId;
            currentUser.firstName = u.firstName;
            currentUser.lastName = u.lastName;
            currentUser.username = u.username;
          }
          showApp();
          return;
        }
      } catch (e) {}
      document.getElementById('auth').style.display = 'block';
    }

    function showApp() {
      document.getElementById('auth').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('userInfo').innerHTML = `
        <span class="role-badge ${currentUser.role === 'teacher' ? 'bg-warning text-dark' : 'bg-info'}">${currentUser.role === 'teacher' ? 'Nauczyciel' : 'Uczeń'}</span>
        ${currentUser.firstName} ${currentUser.lastName}
      `;
      buildNav();
      if (currentUser.role === 'teacher') loadTeacherDashboard();
      else loadStudentDashboard();
    }

    function buildNav() {
      const nav = document.getElementById('sideNav');
      const unread = (db.messages || []).filter(m => m.toId === currentUser.id && !m.read).length;
      const unreadBadge = unread > 0 ? `<span class="badge bg-danger ms-1">${unread}</span>` : '';
      if (currentUser.role === 'teacher') {
        nav.innerHTML = `
          <a class="nav-link active" href="#" data-view="dash"><i class="bi bi-speedometer2"></i> Panel</a>
          <a class="nav-link" href="#" data-view="classes"><i class="bi bi-people"></i> Klasy</a>
          <a class="nav-link" href="#" data-view="groups"><i class="bi bi-diagram-3"></i> Grupy</a>
          <a class="nav-link" href="#" data-view="students"><i class="bi bi-person-badge"></i> Uczniowie</a>
          <a class="nav-link" href="#" data-view="subjects"><i class="bi bi-book"></i> Przedmioty</a>
          <a class="nav-link" href="#" data-view="grades"><i class="bi bi-star"></i> Oceny</a>
          <a class="nav-link" href="#" data-view="attendance"><i class="bi bi-calendar-check"></i> Frekwencja</a>
          <a class="nav-link" href="#" data-view="remarks"><i class="bi bi-chat-left-text"></i> Uwagi</a>
          <a class="nav-link" href="#" data-view="tests"><i class="bi bi-ui-checks"></i> Testy</a>
          <a class="nav-link" href="#" data-view="homework"><i class="bi bi-journal-text"></i> Prace domowe</a>
          <a class="nav-link" href="#" data-view="announcements"><i class="bi bi-megaphone"></i> Ogłoszenia</a>
          <a class="nav-link" href="#" data-view="messages"><i class="bi bi-envelope"></i> Wiadomości${unreadBadge}</a>
          <a class="nav-link" href="#" data-view="codes"><i class="bi bi-key"></i> Kody</a>
          <a class="nav-link" href="#" data-view="settings"><i class="bi bi-gear"></i> Ustawienia</a>
        `;
      } else {
        nav.innerHTML = `
          <a class="nav-link active" href="#" data-view="dash"><i class="bi bi-speedometer2"></i> Moje dane</a>
          <a class="nav-link" href="#" data-view="grades"><i class="bi bi-star"></i> Oceny</a>
          <a class="nav-link" href="#" data-view="attendance"><i class="bi bi-calendar-check"></i> Frekwencja</a>
          <a class="nav-link" href="#" data-view="remarks"><i class="bi bi-chat-left-text"></i> Uwagi</a>
          <a class="nav-link" href="#" data-view="tests"><i class="bi bi-ui-checks"></i> Testy</a>
          <a class="nav-link" href="#" data-view="homework"><i class="bi bi-journal-text"></i> Prace domowe</a>
          <a class="nav-link" href="#" data-view="announcements"><i class="bi bi-megaphone"></i> Ogłoszenia</a>
          <a class="nav-link" href="#" data-view="messages"><i class="bi bi-envelope"></i> Wiadomości${unreadBadge}</a>
          <a class="nav-link" href="#" data-view="settings"><i class="bi bi-gear"></i> Ustawienia</a>
        `;
      }
      nav.querySelectorAll('.nav-link').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          nav.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
          a.classList.add('active');
          const v = a.dataset.view;
          if (currentUser.role === 'teacher') {
            if (v === 'dash') loadTeacherDashboard();
            else if (v === 'classes') loadClasses();
            else if (v === 'groups') loadGroupsTeacher();
            else if (v === 'students') loadStudents();
            else if (v === 'subjects') loadSubjects();
            else if (v === 'grades') loadGradesTeacher();
            else if (v === 'attendance') loadAttendanceTeacher();
            else if (v === 'remarks') loadRemarksTeacher();
            else if (v === 'tests') loadTestsTeacher();
            else if (v === 'homework') loadHomeworkTeacher();
            else if (v === 'announcements') loadAnnouncementsTeacher();
            else if (v === 'messages') loadMessages();
            else if (v === 'codes') loadCodesTeacher();
            else if (v === 'settings') loadSettings();
          } else {
            if (v === 'dash') loadStudentDashboard();
            else if (v === 'grades') loadMyGrades();
            else if (v === 'attendance') loadMyAttendance();
            else if (v === 'remarks') loadMyRemarks();
            else if (v === 'tests') loadTestsStudent();
            else if (v === 'homework') loadHomeworkStudent();
            else if (v === 'announcements') loadAnnouncementsStudent();
            else if (v === 'messages') loadMessages();
            else if (v === 'settings') loadSettings();
          }
        });
      });
    }

    // ===== TEACHER: DASHBOARD & CORE =====
    function loadTeacherDashboard() {
      const students = db.users.filter(u => u.role === 'student');
      const grades = db.grades;
      const activeTests = (db.tests || []).filter(t => t.active).length;
      const unreadMsg = (db.messages || []).filter(m => m.toId === currentUser.id && !m.read).length;
      document.getElementById('content').innerHTML = `
        <h4 class="mb-4">Panel nauczyciela</h4>
        <div class="row g-3 mb-4">
          <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center">
            <div class="fs-2 fw-bold text-primary">${db.classes.length}</div><div class="text-muted small">Klas</div>
          </div></div></div>
          <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center">
            <div class="fs-2 fw-bold text-success">${students.length}</div><div class="text-muted small">Uczniów</div>
          </div></div></div>
          <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center">
            <div class="fs-2 fw-bold text-warning">${grades.length}</div><div class="text-muted small">Ocen</div>
          </div></div></div>
          <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center">
            <div class="fs-2 fw-bold text-info">${activeTests}</div><div class="text-muted small">Aktywnych testów</div>
          </div></div></div>
          <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center">
            <div class="fs-2 fw-bold text-secondary">${(db.groups || []).length}</div><div class="text-muted small">Grup</div>
          </div></div></div>
          <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center">
            <div class="fs-2 fw-bold text-danger">${unreadMsg}</div><div class="text-muted small">Nieprzeczytanych</div>
          </div></div></div>
        </div>
        <div class="card"><div class="card-header">Ostatnie oceny</div>
          <div class="card-body p-0"><div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead><tr><th>Data</th><th>Uczeń</th><th>Przedmiot</th><th>Ocena</th><th>Opis</th></tr></thead>
              <tbody>

    function loadGroupsTeacher() {
      const groups = db.groups || [];
      document.getElementById('content').innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="mb-0">Grupy klasowe</h4>

          ${groups.map(g => {
            const cls = db.classes.find(c => c.id === g.classId);
            const members = (g.memberIds || []).map(mid => db.users.find(u => u.id === mid)).filter(Boolean);
            const classStudents = db.users.filter(u => u.role === 'student' && u.classId === g.classId);
            return `
              <div class="col-md-6">
                <div class="card h-100">
                  <div class="card-header d-flex justify-content-between align-items-center">
                    <span><strong>${g.name}</strong> <span class="text-muted small">(${cls ? cls.name : '—'})</span></span>
                    <button class="btn btn-outline-danger btn-sm" onclick="deleteGroup('${g.id}')"><i class="bi bi-trash"></i></button>
                  </div>
                  <div class="card-body">
                    <div class="mb-2 small text-muted">Członkowie (${members.length}):</div>
                    ${members.length ? members.map(m => `
                      <span class="badge bg-light text-dark me-1 mb-1">${m.lastName} ${m.firstName}
                        <button class="btn btn-sm p-0 ms-1 text-danger" onclick="removeFromGroup('${g.id}','${m.id}')" title="Usuń">&times;</button>
                      </span>
                    `).join('') : '<span class="text-muted small">Brak członków</span>'}
                    <hr>
                    <label class="form-label small">Dodaj ucznia z klasy:</label>
                    <select class="form-select form-select-sm" onchange="if(this.value){addToGroup('${g.id}',this.value);this.value='';}">
                      <option value="">— wybierz —</option>
                      ${classStudents.filter(s => !(g.memberIds || []).includes(s.id)).map(s =>
                        `<option value="${s.id}">${s.lastName} ${s.firstName}</option>`
                      ).join('')}
                    </select>
                  </div>
                </div>
              </div>`;
          }).join('')}
        </div>
      `;
    }
    function addGroup() {
      const name = document.getElementById('newGroupName').value.trim();
      const classId = document.getElementById('newGroupClass').value;
      if (!name || !classId) return showToast('Wypełnij nazwę i klasę', true);
      if (!db.groups) db.groups = [];
      db.groups.push({ id: uid(), name, classId, memberIds: [], createdAt: new Date().toISOString() });
      saveDB(db); showToast('Grupa utworzona'); loadGroupsTeacher();
    }
    function deleteGroup(id) {
      if (!confirm('Usunąć grupę?')) return;
      db.groups = (db.groups || []).filter(g => g.id !== id);
      saveDB(db); showToast('Usunięto'); loadGroupsTeacher();
    }
    function addToGroup(groupId, studentId) {
      const g = (db.groups || []).find(x => x.id === groupId);
      if (!g) return;
      if (!g.memberIds) g.memberIds = [];
      if (g.memberIds.includes(studentId)) return;
      // usuwamy z innych grup tej samej klasy
      (db.groups || []).forEach(og => {
        if (og.classId === g.classId && og.id !== groupId) {
          og.memberIds = (og.memberIds || []).filter(id => id !== studentId);
        }
      });
      g.memberIds.push(studentId);
      saveDB(db); showToast('Dodano do grupy'); loadGroupsTeacher();
    }
    function removeFromGroup(groupId, studentId) {
      const g = (db.groups || []).find(x => x.id === groupId);
      if (!g) return;
      g.memberIds = (g.memberIds || []).filter(id => id !== studentId);
      saveDB(db); showToast('Usunięto z grupy'); loadGroupsTeacher();
    }

            <tbody>
              ${codes.slice().reverse().map(c => `
                <tr>
                  <td class="fw-semibold font-monospace">${c.code}</td>
                  <td class="text-muted small">${new Date(c.createdAt).toLocaleString('pl')}</td>
                  <td>${c.used ? '<span class="badge bg-secondary">Użyty</span>' : '<span class="badge bg-success">Dostępny</span>'}</td>

                  </td>
                </tr>
              `).join('') || '<tr><td colspan="5" class="text-center text-muted py-4">Brak kodów — wygeneruj pierwszy</td></tr>'}

    function generateCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)];
      if (!db.registrationCodes) db.registrationCodes = [];
      if (db.registrationCodes.find(c => c.code === code)) return generateCode();
      db.registrationCodes.push({
        id: uid(),
        code,
        used: false,
        createdAt: new Date().toISOString()
      });
      saveDB(db);
      showToast('Wygenerowano kod: ' + code);
      loadCodesTeacher();
    }
    function deleteCode(id) {
      if (!confirm('Usunąć kod?')) return;
      db.registrationCodes = (db.registrationCodes || []).filter(c => c.id !== id);
      saveDB(db);
      showToast('Usunięto');
      loadCodesTeacher();
    }

    function loadMessages() {

        if (m.toId === currentUser.id && !m.read) { m.read = true; changed = true; }

      if (changed) saveDB(db);

      const teachers = db.users.filter(u => u.role === 'teacher');
      const students = db.users.filter(u => u.role === 'student');
      const recipients = currentUser.role === 'student' ? teachers : students;

      document.getElementById('content').innerHTML = `

          <h4 class="mb-0">Wiadomości</h4>

                ${recipients.map(r => `<option value="${r.id}">${r.lastName} ${r.firstName}${r.role === 'teacher' ? ' (nauczyciel)' : ''}</option>`).join('')}

          </div>
        </div>

        <div class="list-group">
          ${msgs.map(m => {
            const from = db.users.find(u => u.id === m.fromId);
            const to = db.users.find(u => u.id === m.toId);
            const isFromMe = m.fromId === currentUser.id;
            return `
              <div class="list-group-item ${!m.read && !isFromMe ? 'msg-unread' : ''}">
                <div class="d-flex justify-content-between">

                <div class="text-muted">${m.body}</div>

          }).join('')}

      `;

    function sendMessage() {
      const toId = document.getElementById('msgTo').value;
      const subject = document.getElementById('msgSubject').value.trim();
      const body = document.getElementById('msgBody').value.trim();
      if (!toId || !body) return showToast('Wybierz odbiorcę i napisz treść', true);
      if (!db.messages) db.messages = [];
      db.messages.push({
        id: uid(),
        fromId: currentUser.id,
        toId,
        subject: subject || '(bez tematu)',

        read: false,
        createdAt: new Date().toISOString()

      showToast('Wiadomość wysłana');

    // ===== USTAWIENIA KONTA =====
    function loadSettings() {
      const u = db.users.find(x => x.id === currentUser.id);
      if (!u) return;
      const isTeacher = currentUser.role === 'teacher';
      document.getElementById('content').innerHTML = `
        <h4 class="mb-4">Ustawienia konta</h4>
        <div class="card" style="max-width:480px">
          <div class="card-body">
            ${isTeacher ? `
              <div class="mb-3">
                <label class="form-label">Imię</label>
                <input type="text" class="form-control" id="setFirstName" value="${(u.firstName || '').replace(/"/g, '&quot;')}">
              </div>
              <div class="mb-3">
                <label class="form-label">Nazwisko</label>
                <input type="text" class="form-control" id="setLastName" value="${(u.lastName || '').replace(/"/g, '&quot;')}">
              </div>
            ` : `
              <div class="mb-3">
                <label class="form-label">Imię i nazwisko</label>
                <input type="text" class="form-control" value="${u.firstName} ${u.lastName}" disabled>
                <div class="form-text">Uczniowie nie mogą zmieniać imienia i nazwiska.</div>
              </div>
            `}
            <div class="mb-3">
              <label class="form-label">Login</label>
              <input type="text" class="form-control" id="setUsername" value="${(u.username || '').replace(/"/g, '&quot;')}">
            </div>
            <div class="mb-3">
              <label class="form-label">Nowe hasło</label>
              <input type="password" class="form-control" id="setPassword" placeholder="Zostaw puste, aby nie zmieniać">
            </div>
            <div class="mb-3">
              <label class="form-label">Potwierdź hasło</label>
              <input type="password" class="form-control" id="setPassword2" placeholder="Powtórz nowe hasło">
            </div>
            <div class="alert alert-danger d-none" id="setError"></div>
            <button class="btn btn-primary" onclick="saveSettings()"><i class="bi bi-check-lg"></i> Zapisz zmiany</button>
          </div>
        </div>
      `;
    }
    function saveSettings() {
      const u = db.users.find(x => x.id === currentUser.id);
      if (!u) return;
      const err = document.getElementById('setError');
      err.classList.add('d-none');
      const isTeacher = currentUser.role === 'teacher';

      if (isTeacher) {
        const firstName = document.getElementById('setFirstName').value.trim();
        const lastName = document.getElementById('setLastName').value.trim();
        if (!firstName || !lastName) {
          err.textContent = 'Imię i nazwisko są wymagane';
          err.classList.remove('d-none');
          return;
        }
        u.firstName = firstName;
        u.lastName = lastName;
      }

      const username = document.getElementById('setUsername').value.trim();
      if (!username || username.length < 3) {
        err.textContent = 'Login min. 3 znaki';
        err.classList.remove('d-none');
        return;
      }
      if (db.users.find(x => x.id !== u.id && x.username.toLowerCase() === username.toLowerCase())) {
        err.textContent = 'Taki login już istnieje';
        err.classList.remove('d-none');
        return;
      }
      u.username = username;

      const pass = document.getElementById('setPassword').value;
      const pass2 = document.getElementById('setPassword2').value;
      if (pass) {
        if (pass.length < 4) {
          err.textContent = 'Hasło min. 4 znaki';
          err.classList.remove('d-none');
          return;
        }
        if (pass !== pass2) {
          err.textContent = 'Hasła nie są identyczne';
          err.classList.remove('d-none');
          return;
        }
        u.password = pass;
      }

      saveDB(db);
      currentUser.username = u.username;
      currentUser.firstName = u.firstName;
      currentUser.lastName = u.lastName;
      saveSession(currentUser);
      document.getElementById('userInfo').innerHTML = `
        <span class="role-badge ${currentUser.role === 'teacher' ? 'bg-warning text-dark' : 'bg-info'}">${currentUser.role === 'teacher' ? 'Nauczyciel' : 'Uczeń'}</span>
        ${currentUser.firstName} ${currentUser.lastName}
      `;
      showToast('Zapisano zmiany');
      loadSettings();
    }

            <div class="d-flex justify-content-between mb-2">
              <span class="badge bg-primary">Pytanie ${qi + 1}</span>
              <button class="btn btn-sm btn-outline-danger" onclick="removeQuestion(${qi})"><i class="bi bi-trash"></i></button>
            </div>
            <input type="text" class="form-control mb-3" value="${(q.text || '').replace(/"/g, '&quot;')}"
              onchange="window._editTest.questions[${qi}].text = this.value" placeholder="Treść pytania">
            <div class="small text-muted mb-2">Odpowiedzi (zaznacz poprawną):</div>
            ${(q.options || ['', '', '', '']).map((opt, oi) => `
              <div class="input-group mb-2">
                <span class="input-group-text">
                  <input type="radio" name="correct_${qi}" ${q.correct === oi ? 'checked' : ''}
                    onchange="window._editTest.questions[${qi}].correct = ${oi}">
                </span>
                <input type="text" class="form-control ${q.correct === oi ? 'border-success' : ''}"
                  value="${(opt || '').replace(/"/g, '&quot;')}"
                  onchange="window._editTest.questions[${qi}].options[${oi}] = this.value"
                  placeholder="Odpowiedź ${String.fromCharCode(65 + oi)}">
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function addQuestionToEditor() {
      if (!window._editTest.questions) window._editTest.questions = [];
      window._editTest.questions.push({
        id: uid(),
        text: '',
        options: ['', '', '', ''],
        correct: 0
      });
      renderQuestionsList();
    }

    function removeQuestion(idx) {
      window._editTest.questions.splice(idx, 1);
      renderQuestionsList();
    }

    function saveTest() {
      const title = document.getElementById('testTitle').value.trim();
      if (!title) return showToast('Podaj tytuł testu', true);
      const qs = window._editTest.questions || [];
      if (qs.length === 0) return showToast('Dodaj przynajmniej jedno pytanie', true);
      for (let i = 0; i < qs.length; i++) {
        if (!qs[i].text.trim()) return showToast(`Pytanie ${i + 1}: uzupełnij treść`, true);
        if ((qs[i].options || []).filter(o => o && o.trim()).length < 2) {
          return showToast(`Pytanie ${i + 1}: podaj min. 2 odpowiedzi`, true);
        }
        if (qs[i].correct === undefined || qs[i].correct === null) {
          return showToast(`Pytanie ${i + 1}: zaznacz poprawną odpowiedź`, true);
        }
      }
      const timeLimitRaw = document.getElementById('testTimeLimit').value;
      const timeLimitMinutes = timeLimitRaw ? parseInt(timeLimitRaw, 10) : null;
      if (timeLimitMinutes !== null && (isNaN(timeLimitMinutes) || timeLimitMinutes < 1)) {
        return showToast('Czas musi być liczbą ≥ 1', true);
      }
      const deadlineRaw = document.getElementById('testDeadline').value;
      const deadline = deadlineRaw ? new Date(deadlineRaw).toISOString() : null;

      if (editingTestId) {
        const idx = db.tests.findIndex(t => t.id === editingTestId);
        if (idx >= 0) {
          db.tests[idx].title = title;
          db.tests[idx].questions = qs;
          db.tests[idx].timeLimitMinutes = timeLimitMinutes;
          db.tests[idx].deadline = deadline;
        }
      } else {
        if (!db.tests) db.tests = [];
        db.tests.push({
          id: uid(),
          title,
          questions: qs,
          timeLimitMinutes,
          deadline,
          active: false,
          createdAt: new Date().toISOString()
        });
      }
      saveDB(db);
      showToast('Test zapisany');
      loadTestsTeacher();
    }

    function toggleTestActive(id) {
      const t = db.tests.find(x => x.id === id);
      if (!t) return;
      t.active = !t.active;
      saveDB(db);
      showToast(t.active ? 'Test aktywowany — uczniowie mogą go rozwiązywać' : 'Test dezaktywowany');
      loadTestsTeacher();
    }

    function deleteTest(id) {
      if (!confirm('Usunąć test wraz z wynikami uczniów?')) return;
      db.tests = db.tests.filter(t => t.id !== id);
      db.submissions = (db.submissions || []).filter(s => s.testId !== id);
      saveDB(db);
      showToast('Usunięto');
      loadTestsTeacher();
    }

    function viewTestResults(testId) {
      const t = db.tests.find(x => x.id === testId);
      if (!t) return;
      const subs = (db.submissions || []).filter(s => s.testId === testId);
      document.getElementById('content').innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="mb-0">Wyniki: ${t.title}</h4>
          <button class="btn btn-outline-secondary btn-sm" onclick="loadTestsTeacher()">← Wróć</button>
        </div>
        <div class="card"><div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead><tr><th>Uczeń</th><th>Wynik</th><th>%</th><th>Data</th></tr></thead>
            <tbody>
              ${subs.length ? subs.map(s => {
                const st = db.users.find(u => u.id === s.studentId);
                const pct = t.questions.length ? Math.round((s.score / t.questions.length) * 100) : 0;
                return `<tr>
                  <td>${st ? st.lastName + ' ' + st.firstName : '—'}</td>
                  <td><strong>${s.score}</strong> / ${t.questions.length}</td>
                  <td><span class="badge ${pct >= 50 ? 'bg-success' : 'bg-danger'}">${pct}%</span></td>
                  <td class="text-muted small">${new Date(s.submittedAt).toLocaleString('pl')}</td>
                </tr>`;
              }).join('') : '<tr><td colspan="4" class="text-center text-muted py-4">Nikt jeszcze nie rozwiązał tego testu</td></tr>'}
            </tbody>
          </table>
        </div></div>
      `;
    }

    // ===== TESTS – STUDENT =====
    function loadTestsStudent() {
      const now = new Date();
      const tests = (db.tests || []).filter(t => {
        if (!t.active) return false;
        if (t.deadline && new Date(t.deadline) < now) return false;
        return true;
      });
      const mySubs = (db.submissions || []).filter(s => s.studentId === currentUser.id);
      document.getElementById('content').innerHTML = `
        <h4 class="mb-4">Dostępne testy</h4>
        ${tests.length === 0 ? `<div class="empty-state"><i class="bi bi-ui-checks"></i><p>Brak aktywnych testów</p></div>` : ''}
        <div class="row g-3">
          ${tests.map(t => {
            const sub = mySubs.find(s => s.testId === t.id);
            const pct = sub && t.questions.length ? Math.round((sub.score / t.questions.length) * 100) : null;
            const timeInfo = t.timeLimitMinutes ? `<span class="badge bg-light text-dark me-1"><i class="bi bi-clock"></i> ${t.timeLimitMinutes} min</span>` : '';
            const deadlineInfo = t.deadline ? `<span class="badge bg-light text-dark"><i class="bi bi-calendar-event"></i> do ${new Date(t.deadline).toLocaleString('pl')}</span>` : '';
            return `
              <div class="col-md-6">
                <div class="card h-100">
                  <div class="card-body">
                    <h5 class="card-title">${t.title}</h5>
                    <p class="text-muted small mb-2">${t.questions.length} pytań</p>
                    <div class="mb-3">${timeInfo}${deadlineInfo}</div>
                    ${sub ? `
                      <div class="alert alert-info mb-2 py-2">
                        Twój wynik: <strong>${sub.score}/${t.questions.length}</strong> (${pct}%)
                      </div>
                      <button class="btn btn-outline-secondary btn-sm" disabled>Już rozwiązany</button>
                    ` : `
                      <button class="btn btn-primary" onclick="startTest('${t.id}')">
                        <i class="bi bi-play-fill"></i> Rozpocznij test
                      </button>
                    `}
                  </div>
                </div>
              </div>`;
          }).join('')}
        </div>
      `;
    }

    function startTest(testId) {
      const t = db.tests.find(x => x.id === testId);
      if (!t || !t.active) return showToast('Test niedostępny', true);
      if (t.deadline && new Date(t.deadline) < new Date()) {
        return showToast('Termin testu minął', true);
      }
      if ((db.submissions || []).find(s => s.testId === testId && s.studentId === currentUser.id)) {
        return showToast('Już rozwiązałeś ten test', true);
      }
      window._takingTest = {
        testId,
        answers: {},
        startedAt: Date.now(),
        timeLimitMs: t.timeLimitMinutes ? t.timeLimitMinutes * 60 * 1000 : null,
        deadline: t.deadline ? new Date(t.deadline).getTime() : null
      };
      renderTakeTest(t);
      startTestTimer(t);
    }

    function startTestTimer(t) {
      if (testTimerInterval) clearInterval(testTimerInterval);
      const timerEl = document.getElementById('testTimer');
      if (!timerEl && !window._takingTest.timeLimitMs && !window._takingTest.deadline) return;

      testTimerInterval = setInterval(() => {
        const now = Date.now();
        let remainingMs = Infinity;

        if (window._takingTest.timeLimitMs) {
          const elapsed = now - window._takingTest.startedAt;
          remainingMs = Math.min(remainingMs, window._takingTest.timeLimitMs - elapsed);
        }
        if (window._takingTest.deadline) {
          remainingMs = Math.min(remainingMs, window._takingTest.deadline - now);
        }

        if (remainingMs <= 0) {
          clearInterval(testTimerInterval);
          testTimerInterval = null;
          showToast('Czas minął — test został automatycznie oceniony', true);
          autoSubmitTest();
          return;
        }

        if (timerEl) {
          const mins = Math.floor(remainingMs / 60000);
          const secs = Math.floor((remainingMs % 60000) / 1000);
          timerEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
          if (remainingMs < 60000) timerEl.classList.add('text-danger');
          else timerEl.classList.remove('text-danger');
        }
      }, 500);
    }

    function autoSubmitTest() {
      if (!window._takingTest) return;
      const t = db.tests.find(x => x.id === window._takingTest.testId);
      if (!t) return;
      if ((db.submissions || []).find(s => s.testId === t.id && s.studentId === currentUser.id)) return;
      const answers = window._takingTest.answers || {};
      let score = 0;
      t.questions.forEach((q, qi) => {
        if (answers[qi] === q.correct) score++;
      });
      if (!db.submissions) db.submissions = [];
      db.submissions.push({
        id: uid(),
        testId: t.id,
        studentId: currentUser.id,
        answers: { ...answers },
        score,
        submittedAt: new Date().toISOString(),
        autoSubmitted: true
      });
      saveDB(db);
      window._takingTest = null;
      loadTestsStudent();
    }

    function renderTakeTest(t) {
      const hasTimer = t.timeLimitMinutes || t.deadline;
      document.getElementById('content').innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="mb-0">${t.title}</h4>
          <div class="d-flex align-items-center gap-3">
            ${hasTimer ? `<span class="fw-bold fs-5" id="testTimer">--:--</span>` : ''}
            <button class="btn btn-outline-secondary btn-sm" onclick="cancelTakingTest()">Anuluj</button>
          </div>
        </div>
        <form id="testForm" onsubmit="submitTest(event)">
          ${t.questions.map((q, qi) => `
            <div class="card mb-3">
              <div class="card-body">
                <div class="fw-semibold mb-3">${qi + 1}. ${q.text}</div>
                ${(q.options || []).map((opt, oi) => opt ? `
                  <label class="option-row d-block" id="opt_${qi}_${oi}">
                    <input type="radio" name="q_${qi}" value="${oi}" class="form-check-input me-2"
                      onchange="selectOption(${qi}, ${oi})">
                    ${String.fromCharCode(65 + oi)}. ${opt}
                  </label>
                ` : '').join('')}
              </div>
            </div>
          `).join('')}
          <button type="submit" class="btn btn-primary btn-lg w-100">
            <i class="bi bi-send"></i> Wyślij odpowiedzi
          </button>
        </form>
      `;
    }

    function cancelTakingTest() {
      if (testTimerInterval) { clearInterval(testTimerInterval); testTimerInterval = null; }
      window._takingTest = null;
      loadTestsStudent();
    }

    function selectOption(qi, oi) {
      if (!window._takingTest) return;
      window._takingTest.answers[qi] = oi;
      // highlight
      document.querySelectorAll(`[id^="opt_${qi}_"]`).forEach(el => el.classList.remove('selected'));
      const el = document.getElementById(`opt_${qi}_${oi}`);
      if (el) el.classList.add('selected');
    }

    function submitTest(e) {
      e.preventDefault();
      if (testTimerInterval) { clearInterval(testTimerInterval); testTimerInterval = null; }
      const t = db.tests.find(x => x.id === window._takingTest.testId);
      if (!t) return;
      const answers = window._takingTest.answers;
      let score = 0;
      t.questions.forEach((q, qi) => {
        if (answers[qi] === q.correct) score++;
      });
      if (!db.submissions) db.submissions = [];
      db.submissions.push({
        id: uid(),
        testId: t.id,
        studentId: currentUser.id,
        answers: { ...answers },
        score,
        submittedAt: new Date().toISOString()
      });
      saveDB(db);
      window._takingTest = null;
      showToast(`Test oddany! Wynik: ${score}/${t.questions.length}`);
      loadTestsStudent();
    }

    // ===== STUDENT VIEWS =====
    function loadStudentDashboard() {
      const grades = db.grades.filter(g => g.studentId === currentUser.id);
      const att = db.attendance.filter(a => a.studentId === currentUser.id);
      const remarks = db.remarks.filter(r => r.studentId === currentUser.id);
      const present = att.filter(a => a.status === 'obecny').length;
      const absent = att.filter(a => a.status === 'nieobecny').length;
      const now = new Date();
      const activeTests = (db.tests || []).filter(t => t.active && (!t.deadline || new Date(t.deadline) >= now)).length;
      const doneTests = (db.submissions || []).filter(s => s.studentId === currentUser.id).length;
      const unreadMsg = (db.messages || []).filter(m => m.toId === currentUser.id && !m.read).length;
      document.getElementById('content').innerHTML = `
        <h4 class="mb-1">Witaj, ${currentUser.firstName}!</h4>
        <p class="text-muted mb-4">Twoje podsumowanie</p>
        <div class="row g-3 mb-4">
          <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center">
            <div class="fs-2 fw-bold text-primary">${grades.length}</div><div class="text-muted small">Ocen</div>
          </div></div></div>
          <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center">
            <div class="fs-2 fw-bold text-success">${present}</div><div class="text-muted small">Obecności</div>
          </div></div></div>
          <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center">
            <div class="fs-2 fw-bold text-danger">${absent}</div><div class="text-muted small">Nieobecności</div>
          </div></div></div>
          <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center">
            <div class="fs-2 fw-bold text-info">${doneTests}/${activeTests}</div><div class="text-muted small">Testów</div>
          </div></div></div>
          <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center">
            <div class="fs-2 fw-bold text-warning">${(db.homework || []).filter(h => {
              const sub = db.subjects.find(s => s.id === h.subjectId);
              return sub && sub.classId === currentUser.classId;
            }).length}</div><div class="text-muted small">Prac dom.</div>
          </div></div></div>
          <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center">
            <div class="fs-2 fw-bold text-secondary">${unreadMsg}</div><div class="text-muted small">Wiadomości</div>
          </div></div></div>
        </div>
        <div class="card">
          <div class="card-header">Ostatnie oceny</div>
          <div class="card-body p-0">
            <table class="table table-hover mb-0">
              <thead><tr><th>Data</th><th>Przedmiot</th><th>Ocena</th><th>Opis</th></tr></thead>
              <tbody>
                ${grades.slice(-6).reverse().map(g => {
                  const sub = db.subjects.find(s => s.id === g.subjectId);
                  return `<tr>
                    <td>${g.date}</td>
                    <td>${sub ? sub.name : '—'}</td>
                    <td><span class="grade-badge ${gradeClass(g.value)}">${g.value}</span></td>
                    <td class="text-muted small">${g.description || '—'}</td>
                  </tr>`;
                }).join('') || '<tr><td colspan="4" class="text-center text-muted">Brak ocen</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function loadMyGrades() {
      const grades = db.grades.filter(g => g.studentId === currentUser.id);
      const bySubject = {};
      grades.forEach(g => {
        const sub = db.subjects.find(s => s.id === g.subjectId);
        const name = sub ? sub.name : 'Inne';
        if (!bySubject[name]) bySubject[name] = [];
        bySubject[name].push(g);
      });
      let html = `<h4 class="mb-4">Moje oceny</h4>`;
      if (Object.keys(bySubject).length === 0) {
        html += `<div class="empty-state"><i class="bi bi-star"></i><p>Brak ocen</p></div>`;
      } else {
        for (const [subj, list] of Object.entries(bySubject)) {
          let sum = 0, wsum = 0;
          list.forEach(g => {
            let n = parseFloat(String(g.value).replace(',', '.').replace('+', '.25').replace('-', '-.25'));
            if (!isNaN(n)) { sum += n * (g.weight || 1); wsum += (g.weight || 1); }
          });
          const avg = wsum ? (sum / wsum).toFixed(2) : '—';
          html += `
            <div class="card mb-3">
              <div class="card-header d-flex justify-content-between">
                <span>${subj}</span>
                <span class="text-muted small">Średnia: <strong>${avg}</strong></span>
              </div>
              <div class="card-body">
                <div class="d-flex flex-wrap gap-2">
                  ${list.map(g => `
                    <div class="text-center" title="${g.description || ''} (${g.date})">
                      <span class="grade-badge ${gradeClass(g.value)}">${g.value}</span>
                      <div class="small text-muted" style="font-size:.65rem">${g.date.slice(5)}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>`;
        }
      }
      document.getElementById('content').innerHTML = html;
    }

    function loadMyAttendance() {
      const att = db.attendance.filter(a => a.studentId === currentUser.id);
      document.getElementById('content').innerHTML = `
        <h4 class="mb-4">Moja frekwencja</h4>
        <div class="card"><div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead><tr><th>Data</th><th>Status</th><th>Lekcja</th><th>Notatka</th></tr></thead>
            <tbody>
              ${att.slice().reverse().map(a => `
                <tr>
                  <td>${a.date}</td>
                  <td>${statusBadge(a.status)}</td>
                  <td>${a.lesson || '—'}</td>
                  <td class="text-muted small">${a.note || '—'}</td>
                </tr>
              `).join('') || '<tr><td colspan="4" class="text-center text-muted py-4">Brak wpisów</td></tr>'}
            </tbody>
          </table>
        </div></div>
      `;
    }

    function loadMyRemarks() {
      const remarks = db.remarks.filter(r => r.studentId === currentUser.id);
      document.getElementById('content').innerHTML = `
        <h4 class="mb-4">Moje uwagi i pochwały</h4>
        <div class="card"><div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead><tr><th>Data</th><th>Typ</th><th>Treść</th></tr></thead>
            <tbody>
              ${remarks.slice().reverse().map(r => `
                <tr>
                  <td>${r.date}</td>
                  <td><span class="badge ${r.type === 'pochwała' ? 'bg-success' : 'bg-warning text-dark'}">${r.type}</span></td>
                  <td>${r.content}</td>
                </tr>
              `).join('') || '<tr><td colspan="3" class="text-center text-muted py-4">Brak wpisów</td></tr>'}
            </tbody>
          </table>
        </div></div>
      `;
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.getElementById('loginForm') && !document.getElementById('loginForm').classList.contains('d-none')) {
        doLogin();
      }
    });

    checkAuth();
  </script>
</body>
</html>
